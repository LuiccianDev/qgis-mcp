name: Release QGIS Plugin & PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify and publish (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.state.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The tag is the only source of the release version, so a forgotten bump
      # would ship a plugin whose metadata.txt disagrees with its own tag.
      - name: Verify tag matches project version and changelog
        id: state
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          uv run --no-project python scripts/release.py --check --expect-tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build & verify artifacts
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-tag.outputs.tag }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint & security checks
        run: |
          uv run --no-sync ruff check qgis_listener/ src/ tests/ install.py scripts/
          uv run --no-sync ruff format --check qgis_listener/ src/ tests/ install.py scripts/
          uv run --no-sync python scripts/release.py --check --expect-tag "${{ needs.verify-tag.outputs.tag }}"

      - name: Run unit test suite
        run: |
          uv run --no-sync pytest tests/ \
            --ignore=tests/test_qgis_live.py \
            --ignore=tests/test_stress.py \
            --ignore=tests/test_tdd.py \
            -q

      - name: Build plugin ZIP and Python package
        # build_plugin_zip.py is stdlib-only and reads metadata.txt; uv build
        # produces the wheel and sdist for luiccian-qgis-mcp.
        run: |
          uv run --no-sync python scripts/build_plugin_zip.py
          uv build
          uv run --no-sync python -m zipfile -l dist/qgis_listener_v*.zip | grep -q "qgis_listener/metadata.txt"

      - name: Smoke-test built wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import qgis_mcp.server; print('OK:', qgis_mcp.server.mcp.name)"

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum qgis_listener_v*.zip *.whl *.tar.gz > SHA256SUMS.txt

      - name: Upload GitHub Release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/qgis_listener_v*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload PyPI distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-tag.outputs.tag }}

      - uses: astral-sh/setup-uv@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist/

      - name: Extract release notes from CHANGELOG
        run: uv run --no-project python scripts/release.py --extract-notes "${{ needs.verify-tag.outputs.tag }}" --output release_body.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/qgis_listener_v*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.verify-tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating assets..."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Release $TAG" \
              --notes-file release_body.md \
              --latest
          fi

  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: [verify-tag, github-release]
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/luiccian-qgis-mcp
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download PyPI distributions
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/

      - name: Generate PyPI artifact attestation (SLSA provenance)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (OIDC + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
